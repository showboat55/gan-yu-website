[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/"
  to = "/zh/"
  status = 302
  force = true

[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/zh"
  to = "/zh/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
